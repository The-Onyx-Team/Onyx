name: Release

# Builds the device apps for a version and publishes them as a GitHub release. The web app's downloads page
# links to these asset names under /releases/latest/download/, so keep them stable.
#
# Normally called by version.yml for every push to master. Pushing a tag by hand works too:
#   git tag v1.2 && git push origin v1.2
#
# Repository secrets used:
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (keytool -genkeypair ... -keystore onyx.keystore)
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias in the keystore
#   ANDROID_KEY_PASSWORD      key password
# Without them the Android job is skipped with a warning (the release then has no APK) instead of publishing an
# unsigned or debug-signed APK.

on:
  push:
    tags: [ "v*" ]
  workflow_call:
    inputs:
      version:
        description: "Version without v, e.g. 0.4; the tag v<version> must exist"
        type: string
        required: true
      ref:
        description: "Commit to build"
        type: string
        required: false
      publish:
        description: "Create the GitHub release"
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.2 (no release is created for manual runs)"
        required: true

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  # From the caller (version.yml) or the manual run, otherwise from the pushed tag.
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  linux-agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [ linux-x64, linux-arm64 ]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: |
          version="${VERSION#v}"
          dotnet publish src/Onyx.Collector/Onyx.Collector.Linux -c Release -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true -p:DebugType=none -p:Version="$version" -o out/onyx-agent
          cp packaging/linux/onyx-agent.service packaging/linux/install.sh packaging/linux/README.md out/onyx-agent/
          tar -C out -czf onyx-agent-${{ matrix.rid }}.tar.gz onyx-agent

      - uses: actions/upload-artifact@v4
        with:
          name: onyx-agent-${{ matrix.rid }}
          path: onyx-agent-${{ matrix.rid }}.tar.gz

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the release gets no Android app (unsigned builds are never published)"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/onyx.keystore"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Publish signed APK and AAB
        if: steps.keystore.outputs.signed == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="${VERSION#v}"
          dotnet publish src/Onyx.App/Onyx.App/Onyx.App.csproj -f net10.0-android -c Release -o out/android \
            -p:Version="$version" -p:ApplicationVersion=${{ github.run_number }} \
            -p:AndroidPackageFormats="aab%3Bapk" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/onyx.keystore" \
            -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD \
            -p:AndroidSigningKeyAlias="$KEY_ALIAS" \
            -p:AndroidSigningKeyPass=env:KEY_PASSWORD
          cp out/android/*-Signed.apk onyx-android.apk
          cp out/android/*-Signed.aab onyx-android.aab

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.signed == 'true'
        with:
          name: onyx-android
          path: onyx-android.apk

      # For uploading to the Play Console (internal / closed testing track). Not attached to the release.
      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.signed == 'true'
        with:
          name: onyx-android-play-bundle
          path: onyx-android.aab

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Publish (unpackaged, self-contained)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VERSION.TrimStart('v')
          # OnyxWindowsOnly narrows the app to its Windows target (see Onyx.App.csproj).
          dotnet publish src/Onyx.App/Onyx.App/Onyx.App.csproj -f net10.0-windows10.0.19041.0 -c Release `
            -p:OnyxWindowsOnly=true `
            -r win-x64 --self-contained -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true `
            -p:Version=$version -p:ApplicationVersion=${{ github.run_number }} -o out/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Native messaging host for the browser extension; the app registers it from its own folder.
          dotnet publish src/Onyx.Collector/Onyx.Collector.NativeHost -c Release -r win-x64 `
            -p:DebugType=none -p:Version=$version -o out/native-host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item out/native-host/onyx-native-host.exe out/windows/
          Compress-Archive -Path out/windows/* -DestinationPath onyx-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: onyx-windows-x64
          path: onyx-windows-x64.zip

  browser-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Package
        run: |
          version="${VERSION#v}"
          # Browser extension versions are 1-4 dot-separated numbers.
          jq --arg v "${version%%-*}" '.version = $v' browser-extension/manifest.json > manifest.tmp
          mv manifest.tmp browser-extension/manifest.json
          (cd browser-extension && zip -r ../onyx-browser-extension.zip . -x README.md)

      - uses: actions/upload-artifact@v4
        with:
          name: onyx-browser-extension
          path: onyx-browser-extension.zip

  release:
    if: inputs.publish || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: [ linux-agent, android, windows, browser-extension ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
          pattern: onyx-{agent-*,android,windows-*,browser-extension}

      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${VERSION#v}"
          gh release create "$tag" assets/* --repo "$GITHUB_REPOSITORY" --title "Onyx $tag" --generate-notes
