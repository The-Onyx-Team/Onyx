# Onyx web dashboard + API with SQL Server.
#
#   cp .env.example .env   # then fill in the values
#   docker compose up -d --build
#
# Put a TLS-terminating reverse proxy (Caddy, nginx, Traefik, ...) in front of port 8080. The app trusts its
# X-Forwarded-Proto/-For headers, so only expose 8080 to that proxy, not to the internet.

services:
  app:
    build:
      context: .
      dockerfile: src/Onyx.App/Onyx.App.Web/Dockerfile
      # Always fetch the current .NET base images: security fixes arrive as new images under the same tag
      # (aspnet:10.0), which a cached copy would never get.
      pull: true
    image: ghcr.io/the-onyx-team/onyx:latest
    container_name: onyx-web
    restart: unless-stopped
    ports:
      # Defaults to localhost for a reverse proxy on the same machine. For a server reached only through a VPN,
      # set ONYX_BIND to the server's VPN address (e.g. 10.8.0.1) instead of 0.0.0.0.
      - "${ONYX_BIND:-127.0.0.1}:${ONYX_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      provider: SqlServer
      ConnectionStrings__SqlServer: "Server=sqlserver;Database=OnyxDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True"
      # Behind the reverse proxy: use the original scheme and client address (redirects, links, rate limits).
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      # JWT signing key and data-protection keys. Losing them logs every user and device out.
      - onyx_data:/app/data
    networks:
      - app_network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: onyx-sqlserver
    restart: unless-stopped
    # No published port: only the app talks to the database.
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - onyx_sqlserver_data:/var/opt/mssql
    networks:
      - app_network

networks:
  app_network:

volumes:
  onyx_data:
  onyx_sqlserver_data:
